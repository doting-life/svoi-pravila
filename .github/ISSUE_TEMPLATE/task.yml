name: Task (CTO)
description: A task for an executor. Written by the CTO; executors implement exactly this.
title: "NNNN — "
labels: ["task"]
body:
  - type: markdown
    attributes:
      value: "Public repository: no names, logins, paths, domains or secrets. Executors follow AGENTS.md."
  - type: input
    id: branch
    attributes:
      label: Branch
      placeholder: task/NNNN-slug
    validations:
      required: true
  - type: dropdown
    id: executor
    attributes:
      label: Executor
      options: ["cursor", "copilot", "any"]
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: textarea
    id: read
    attributes:
      label: Read first (only these sections)
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: User-visible behaviour (after this task)
      description: "One row per control the task adds or changes: where | control | action | result. No two controls on one screen may lead to the same result. Write `none` if nothing user-visible changes."
      value: "| Where | Control | Action | Result |\n|---|---|---|---|\n"
    validations:
      required: true
  - type: textarea
    id: requirements
    attributes:
      label: Requirements
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: Out of scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
    validations:
      required: true
  - type: textarea
    id: live_budget
    attributes:
      label: Live budget
      description: "0 = no live LLM calls. Otherwise: models, operations, cases, repeats, max billable tokens."
      value: "0"
    validations:
      required: true
