name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SP_ENVIRONMENT: test
  SP_LOG_LEVEL: INFO
  SP_HTTP_HOST: 127.0.0.1
  SP_HTTP_PORT: 8000
  SP_DATABASE_URL: postgresql+asyncpg://svoi:svoi_ci@127.0.0.1:5432/svoi_pravila
  SP_VALKEY_URL: redis://127.0.0.1:6379/0
  SP_READINESS_TIMEOUT_SECONDS: "2.0"
  SP_FORWARDED_ALLOW_IPS: "127.0.0.1"
  SP_DATA_KEK_ID: ci-1
  SP_GIGACHAT_CREDENTIALS: ci-dummy-credentials
  SP_GIGACHAT_SCOPE: PERS
  SP_GIGACHAT_CA_BUNDLE_FILE: certs/russian_trusted_root_ca.pem
  SP_GIGACHAT_MODEL_SOFTEN: GigaChat-2
  SP_GIGACHAT_MODEL_HELP_SAY: GigaChat-2
  SP_GIGACHAT_MODEL_DECODE: GigaChat-2
  SP_GIGACHAT_TIMEOUT_SECONDS: "5"
  SP_GIGACHAT_MAX_RETRIES: "0"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: svoi
          POSTGRES_PASSWORD: svoi_ci
          POSTGRES_DB: svoi_pravila
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U svoi -d svoi_pravila"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: valkey/valkey:9.1.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Generate field-encryption KEK
        run: |
          echo "SP_DATA_KEK=$(openssl rand -base64 32)" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Sync dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Lint
        run: make lint

      - name: Format check
        run: make fmt-check

      - name: Typecheck
        run: make typecheck

      - name: Import contracts
        run: make imports

      - name: Migrations check
        run: make migrations-check

      - name: Tests with coverage
        run: make test

      - name: Audit
        run: make audit

  secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run gitleaks
        run: |
          docker run --rm -v "$PWD:/repo:ro" \
            zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source=/repo --verbose

  image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: backend
          push: false
          load: true
          tags: svoi-pravila:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: svoi-pravila:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

  stack-smoke:
    runs-on: ubuntu-latest
    env:
      SP_ENVIRONMENT: test
      SP_TELEGRAM_UPDATES_MODE: disabled
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.22"
          enable-cache: true

      - name: Materialize .env
        run: |
          make dev-env
          python3 - <<'PY'
          from pathlib import Path
          path = Path(".env")
          text = path.read_text()
          for key, value in (
              ("SP_ENVIRONMENT", "test"),
              ("SP_TELEGRAM_UPDATES_MODE", "disabled"),
          ):
              import re
              if re.search(rf"^{key}=", text, flags=re.M):
                  text = re.sub(rf"^{key}=.*$", f"{key}={value}", text, count=1, flags=re.M)
              else:
                  text = text.rstrip() + f"\n{key}={value}\n"
          path.write_text(text)
          PY

      - name: Start local stack
        run: make up

      - name: Assert /readyz
        run: |
          set -euo pipefail
          code="$(curl -s -o /tmp/readyz.json -w '%{http_code}' http://127.0.0.1:8000/readyz)"
          test "$code" = "200"

      - name: Stop local stack
        if: always()
        run: make down

  ownership-guard:
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'task/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Forbid changes to CTO-owned paths
        run: |
          set -euo pipefail
          base="${{ github.base_ref }}"
          git fetch origin "$base"
          if git diff --name-only "origin/${base}...HEAD" | grep -E '^(AGENTS\.md|\.cursor/|docs/maintainers/)'; then
            echo "Task branches must not modify CTO-owned paths." >&2
            exit 1
          fi

