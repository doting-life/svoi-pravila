# PostgreSQL datasource for product analytics aggregates only.
# sslmode=disable: Grafana talks to Postgres on the internal compose network
# (never exposed publicly). The role is read-only and limited to the aggregate tables.
apiVersion: 1
datasources:
  - name: Analytics
    uid: svoi-analytics-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: $SP_GRAFANA_DB_USER
    isDefault: true
    editable: false
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      postgresVersion: 1800
      timescaledb: false
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    secureJsonData:
      password: $SP_GRAFANA_DB_PASSWORD
