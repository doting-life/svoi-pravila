[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[project]
name = "svoi-pravila"
version = "0.1.0"
description = "Svoi Pravila backend"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "structlog==26.1.0",
    "sqlalchemy[asyncio]==2.1.3",
    "asyncpg==0.31.0",
    "alembic==1.20.0",
    "redis==8.1.0",
    "cryptography==50.0.2",
    "uuid-utils==1.0.0",
    "gigachat==0.2.3",
    "aiogram==3.31.0",
]

[project.scripts]
svoi-pravila-api = "svoi_pravila.bootstrap:serve"
svoi-pravila-healthcheck = "svoi_pravila.bootstrap:healthcheck"
svoi-pravila-bench-llm = "svoi_pravila.benchmarks.llm:main"
svoi-pravila-eval = "svoi_pravila.evals.cli:main"

[dependency-groups]
dev = [
    "ruff==0.16.10",
    "mypy==2.4.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "hypothesis==6.168.3",
    "httpx==0.28.1",
    "import-linter==2.15",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
    "respx==0.23.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/svoi_pravila"]

[tool.hatch.build.targets.wheel.force-include]
"src/svoi_pravila/adapters/llm/prompts/soften/v3.md" = "svoi_pravila/adapters/llm/prompts/soften/v3.md"
"src/svoi_pravila/adapters/llm/prompts/help_say/v4.md" = "svoi_pravila/adapters/llm/prompts/help_say/v4.md"
"src/svoi_pravila/adapters/llm/prompts/decode/v3.md" = "svoi_pravila/adapters/llm/prompts/decode/v3.md"
"src/svoi_pravila/adapters/llm/prompts/decode_analysis/v1.md" = "svoi_pravila/adapters/llm/prompts/decode_analysis/v1.md"
"src/svoi_pravila/adapters/consents/personal_data/v1.txt" = "svoi_pravila/adapters/consents/personal_data/v1.txt"
"src/svoi_pravila/adapters/consents/special_category/v1.txt" = "svoi_pravila/adapters/consents/special_category/v1.txt"
"src/svoi_pravila/adapters/channels/telegram/localization/ru.json" = "svoi_pravila/adapters/channels/telegram/localization/ru.json"
"src/svoi_pravila/domain/safety/crisis_patterns/ru/v2.txt" = "svoi_pravila/domain/safety/crisis_patterns/ru/v2.txt"
"src/svoi_pravila/domain/safety/support_resources/ru/v1.txt" = "svoi_pravila/domain/safety/support_resources/ru/v1.txt"

[tool.hatch.build.targets.sdist]
include = ["src/svoi_pravila"]

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "S", "A", "C4", "SIM", "RET", "PTH",
    "ERA", "PL", "RUF", "ASYNC", "T20", "DTZ", "TRY", "PERF", "FBT",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "DTZ001", "RUF001", "TRY003", "S105", "S106"]
"src/svoi_pravila/application/errors.py" = ["N818"]
"src/svoi_pravila/domain/rules.py" = ["PLR0913"]
"src/svoi_pravila/domain/rule_suggestion.py" = ["PLR0913"]
"src/svoi_pravila/domain/pair.py" = ["PLR2004"]
"src/svoi_pravila/benchmarks/**" = ["T201"]
"src/svoi_pravila/evals/**" = ["T201"]
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["svoi_pravila"]

[[tool.mypy.overrides]]
module = "svoi_pravila.application.*"
disallow_any_explicit = true

[[tool.mypy.overrides]]
module = "svoi_pravila.domain.*"
disallow_any_explicit = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
strict_markers = true
strict_config = true
addopts = "--strict-markers --strict-config -W error"
testpaths = ["tests"]
markers = [
    "unit: unit tests without I/O",
    "integration: tests requiring PostgreSQL and Valkey",
]

[tool.coverage.run]
branch = true
source = ["svoi_pravila"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.importlinter]
root_package = "svoi_pravila"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    "svoi_pravila.bootstrap : svoi_pravila.benchmarks : svoi_pravila.evals",
    "svoi_pravila.api | svoi_pravila.adapters",
    "svoi_pravila.application",
    "svoi_pravila.domain",
]

[[tool.importlinter.contracts]]
name = "Persistence and cache are independent"
type = "independence"
modules = [
    "svoi_pravila.adapters.persistence",
    "svoi_pravila.adapters.cache",
]

[[tool.importlinter.contracts]]
name = "LLM is independent of persistence and cache"
type = "independence"
modules = [
    "svoi_pravila.adapters.llm",
    "svoi_pravila.adapters.persistence",
    "svoi_pravila.adapters.cache",
]

[[tool.importlinter.contracts]]
name = "Channels are independent of other adapters"
type = "independence"
modules = [
    "svoi_pravila.adapters.channels",
    "svoi_pravila.adapters.persistence",
    "svoi_pravila.adapters.cache",
    "svoi_pravila.adapters.llm",
    "svoi_pravila.adapters.consents",
]

[[tool.importlinter.contracts]]
name = "Application forbidden imports"
type = "forbidden"
source_modules = [
    "svoi_pravila.application",
]
forbidden_modules = [
    "svoi_pravila.config",
    "svoi_pravila.observability",
    "svoi_pravila.crypto",
    "fastapi",
    "starlette",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "asyncpg",
    "redis",
    "structlog",
    "alembic",
    "gigachat",
    "httpx",
    "aiogram",
]

[[tool.importlinter.contracts]]
name = "Domain forbidden imports"
type = "forbidden"
source_modules = [
    "svoi_pravila.domain",
]
forbidden_modules = [
    "svoi_pravila.application",
    "svoi_pravila.adapters",
    "svoi_pravila.api",
    "svoi_pravila.bootstrap",
    "svoi_pravila.config",
    "svoi_pravila.observability",
    "svoi_pravila.crypto",
    "fastapi",
    "starlette",
    "pydantic",
    "pydantic_settings",
    "sqlalchemy",
    "asyncpg",
    "redis",
    "structlog",
    "alembic",
    "httpx",
    "uvicorn",
    "hypothesis",
    "pytest",
    "aiogram",
]

[[tool.importlinter.contracts]]
name = "Crypto may not import application layers"
type = "forbidden"
source_modules = [
    "svoi_pravila.crypto",
]
forbidden_modules = [
    "svoi_pravila.domain",
    "svoi_pravila.application",
    "svoi_pravila.adapters",
    "svoi_pravila.api",
    "svoi_pravila.bootstrap",
    "svoi_pravila.config",
    "svoi_pravila.observability",
]
