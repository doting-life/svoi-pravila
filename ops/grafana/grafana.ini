# Grafana settings that cannot be given as GF_* variables. An environment variable overrides only
# a key that already exists in defaults.ini; a feature toggle has no key there, so it is set here.
# Everything else is in the `grafana` service environment in deploy/compose.prod.yaml.
[feature_toggles]
# SQL expressions let a dashboard user run SQL over query results inside Grafana.
sqlExpressions = false
