services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - default
      - observability
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  valkey:
    image: valkey/valkey:9.1.2
    restart: unless-stopped
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    command: ["valkey-server", "--requirepass", "${VALKEY_PASSWORD}"]
    ports:
      - "127.0.0.1:${VALKEY_PORT:-6379}:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    profiles: ["app", "observability"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: svoi-pravila-api:local
    restart: "no"
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      SP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SP_VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      SP_HTTP_HOST: "0.0.0.0"
      SP_FORWARDED_ALLOW_IPS: "127.0.0.1"
      SP_GIGACHAT_CA_BUNDLE_FILE: /app/certs/russian_trusted_root_ca.pem
    entrypoint: ["svoi-pravila-migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  api:
    profiles: ["app"]
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: svoi-pravila-api:local
    restart: unless-stopped
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      SP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SP_VALKEY_URL: redis://:${VALKEY_PASSWORD}@valkey:6379/0
      SP_HTTP_HOST: "0.0.0.0"
      SP_FORWARDED_ALLOW_IPS: "127.0.0.1"
      SP_GIGACHAT_CA_BUNDLE_FILE: /app/certs/russian_trusted_root_ca.pem
      SP_METRICS_ENABLED: "true"
      SP_METRICS_PORT: "9100"
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    networks:
      - default
      - metrics
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "svoi-pravila-healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  miniapp:
    profiles: ["app"]
    build:
      context: ./miniapp
      dockerfile: Dockerfile
    image: svoi-pravila-miniapp:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MINIAPP_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
      - /config
      - /data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--url", "http://miniapp:8080"]
    depends_on:
      miniapp:
        condition: service_started
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v3.13.4@sha256:87861b8cf91579109319ebc300f3f1060e6da9c05d6ae8ad15a20c879e84e32e
    restart: unless-stopped
    user: "65534:65534"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.listen-address=0.0.0.0:9090
    volumes:
      - ./ops/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - metrics
      - observability
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

  grafana:
    profiles: ["observability"]
    build:
      context: ./ops/grafana
      dockerfile: Dockerfile
    image: svoi-pravila-grafana:local
    restart: unless-stopped
    user: "472"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${SP_GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
      GF_PATHS_PLUGINS: /usr/share/grafana/plugins
      GF_SERVER_HTTP_ADDR: "0.0.0.0"
      POSTGRES_DB: ${POSTGRES_DB}
      SP_GRAFANA_DB_USER: ${SP_GRAFANA_DB_USER:-grafana_reader}
      SP_GRAFANA_DB_PASSWORD: ${SP_GRAFANA_DB_PASSWORD}
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      # Shared with Postgres and Prometheus. Does not grant lateral access to
      # api/valkey (egress to the public Internet is not blocked by this network).
      - observability
      # Dedicated non-internal network so Docker publishes the host port; Grafana
      # is the only service attached (no lateral access to app services).
      - grafana_edge
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      prometheus:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health | grep -q '\"database\": \"ok\"'",
        ]
      interval: 5s
      timeout: 5s
      retries: 18
      start_period: 40s
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s

networks:
  observability:
    internal: true
  metrics:
    internal: true
  grafana_edge:

volumes:
  postgres_data:
  valkey_data:
  grafana_data:
  prometheus_data:
