# Alertmanager (ADR-0017): a single instance, no cluster, one receiver. The bot token and the
# chat id are read from files mounted from the server (/etc/svoi-pravila/alertmanager); nothing
# secret lives in the repository. The message text comes from telegram.tmpl.
global:
  resolve_timeout: 5m

templates:
  - /etc/alertmanager/telegram.tmpl

route:
  receiver: telegram-owners
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      repeat_interval: 1h

inhibit_rules:
  - source_matchers:
      - alertname="SpLlmBudgetExhausted"
    target_matchers:
      - alertname="SpLlmBudget80"
  - source_matchers:
      - alertname="SpDiskSpaceCritical"
    target_matchers:
      - alertname="SpDiskSpaceLow"
    equal: [mountpoint]
  - source_matchers:
      - alertname="SpApiDown"
    target_matchers:
      - alertname=~"SpHttp5xxRatio|SpLlmErrorRatio|SpRewriteLatencyHigh|SpDecodeTtfcHigh|SpEventLoopLag|SpCacheErrors"

receivers:
  - name: telegram-owners
    telegram_configs:
      - bot_token_file: /etc/svoi-pravila/alertmanager/bot_token
        chat_id_file: /etc/svoi-pravila/alertmanager/chat_id
        parse_mode: HTML
        send_resolved: true
        message: '{{ template "sp.telegram" . }}'
